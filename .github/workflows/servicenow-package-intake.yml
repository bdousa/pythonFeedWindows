name: ServiceNow Python Package Intake

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-active-library-requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Discover active third-party library requests
        shell: bash
        env:
          SERVICENOW_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE }}
          SERVICENOW_USERNAME: ${{ secrets.SERVICENOW_USERNAME }}
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
          REVIEW_REQUIRED_LOGIC_APP_URL: ${{ secrets.REVIEW_REQUIRED_LOGIC_APP_URL }}
        run: |
          python scripts/inspect_servicenow_package_request.py \
            --active-request-category '3rd Party Library Approval' \
            --output active-servicenow-requests.json

      - name: Validate ServiceNow fields and dispatch valid RITMs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
          SERVICENOW_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE }}
          SERVICENOW_USERNAME: ${{ secrets.SERVICENOW_USERNAME }}
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
          REVIEW_REQUIRED_LOGIC_APP_URL: ${{ secrets.REVIEW_REQUIRED_LOGIC_APP_URL }}
        run: |
          python scripts/prepare_servicenow_python_dispatches.py \
            --input active-servicenow-requests.json \
            --output package-dispatches.json
          python - <<'PY'
          import json
          results = json.load(open('package-dispatches.json'))['results']
          counts = {status: sum(item.get('status') == status for item in results) for status in {
              'ready_for_dispatch', 'validation_requested', 'awaiting_requester_correction',
              'awaiting_requester_acknowledgement', 'failed_correction_notification',
              'registry_unavailable', 'failed_registry_enrichment_audit',
          }}
          print(f"ServiceNow validation: correctionRequested={counts['validation_requested']} "
                f"awaitingCorrection={counts['awaiting_requester_correction'] + counts['awaiting_requester_acknowledgement']}")
          print(f"ServiceNow dispatch: ready={counts['ready_for_dispatch']} failed={counts['failed_correction_notification']}")
          print(f"Registry verification: unavailable={counts['registry_unavailable']} "
                f"auditFailed={counts['failed_registry_enrichment_audit']}")
          if counts['failed_correction_notification'] or counts['failed_registry_enrichment_audit']:
            raise SystemExit('Could not record one or more required ServiceNow intake updates.')
          PY
          python - <<'PY' > dispatches.tsv
          import base64
          import json
          for request in json.load(open('package-dispatches.json'))['results']:
              if request.get('status') != 'ready_for_dispatch':
                  continue
              line_context = request.get('lineContext')
              registry_override = request.get('registryOverride')
              request_mode = 'batch-line' if line_context else 'single'
              encoded_line = base64.b64encode(json.dumps(line_context, separators=(',', ':')).encode()).decode() if line_context else '-'
              encoded_override = base64.b64encode(json.dumps(registry_override, separators=(',', ':')).encode()).decode() if registry_override else '-'
              print(f"{request['ticket']}\t{request['package']}\t{request['version']}\t{request_mode}\t{encoded_line}\t{encoded_override}")
          PY
          while IFS=$'\t' read -r ticket package version request_mode line_b64 registry_override_b64; do
            [ -z "$ticket" ] && continue
            title="Package validation — $package — $version — $ticket"
            if gh run list --workflow package-validation-windows.yml --limit 1000 --json displayTitle --jq '.[].displayTitle' | grep -Fqx "$title"; then
              echo "Skipping $ticket because $package@$version already has a package validation run."
              continue
            fi
            dispatch_args=(
              package-validation-windows.yml --ref main
              -f "package_name=$package"
              -f "package_version=$version"
              -f "servicenow_ticket=$ticket"
              -f "servicenow_request_mode=$request_mode"
              -f 'publish_to_feed=true'
            )
            if [ "$line_b64" != '-' ]; then
              dispatch_args+=(-f "servicenow_package_line_b64=$line_b64")
            fi
            if [ "$registry_override_b64" != '-' ]; then
              dispatch_args+=(-f "servicenow_registry_override_b64=$registry_override_b64")
            fi
            gh workflow run "${dispatch_args[@]}"
          done < dispatches.tsv

      - name: Upload intake evidence
        uses: actions/upload-artifact@v4
        with:
          name: servicenow-package-intake-${{ github.run_id }}
          path: |
            active-servicenow-requests.json
            package-dispatches.json